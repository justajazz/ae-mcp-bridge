<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <g font-size="14" fill="#222">
    <!-- tree -->
    <rect x="20" y="20" width="150" height="34" rx="8" fill="#1F1F3A"/>
    <text x="95" y="42" text-anchor="middle" fill="#fff" font-weight="700">Layer "Card"</text>

    <g stroke="#9aa3b5" stroke-width="1.5" fill="none">
      <path d="M40 54 V 280"/>
      <path d="M40 85 H 58"/><path d="M40 150 H 58"/><path d="M40 215 H 58"/><path d="M40 280 H 58"/>
      <path d="M80 96 V 115 H 108"/>
      <path d="M80 161 V 180 H 108"/>
      <path d="M80 226 V 245 H 108"/>
      <path d="M80 291 V 300 H 108"/>
    </g>

    <text x="66" y="90" font-weight="600">Transform</text>
    <text x="116" y="120">Position</text>

    <text x="66" y="155" font-weight="600">Effects</text>
    <text x="116" y="185">Gaussian Blur  ›  Blurriness</text>

    <text x="66" y="220" font-weight="600">Contents</text>
    <text x="116" y="250">Group 1  ›  Contents  ›  Rectangle Path 1  ›  Size</text>

    <text x="66" y="285" font-weight="600">Text</text>
    <text x="116" y="305">Animators  ›  MCP Reveal</text>
  </g>

  <!-- paths -->
  <g font-family="Consolas, monospace" font-size="14">
    <rect x="560" y="100" width="420" height="30" rx="6" fill="#EAF2FF"/>
    <text x="572" y="120" fill="#1d4f9a">"Transform/Position"  or  "Position"</text>
    <rect x="560" y="165" width="420" height="30" rx="6" fill="#EAF2FF"/>
    <text x="572" y="185" fill="#1d4f9a">"Effects/Gaussian Blur/Blurriness"</text>
    <rect x="560" y="230" width="420" height="30" rx="6" fill="#EAF2FF"/>
    <text x="572" y="250" fill="#1d4f9a">"Contents/Group 1/Contents/Rectangle Path 1/Size"</text>
    <rect x="560" y="290" width="420" height="30" rx="6" fill="#EAF2FF"/>
    <text x="572" y="310" fill="#1d4f9a">"Text/Animators/MCP Reveal"</text>
  </g>
  <text x="560" y="62" font-size="14" fill="#555">property = names (or matchNames, or 1-based indices) joined by "/"</text>
  <text x="560" y="82" font-size="13" fill="#888">short names like "Opacity" or "Blurriness" are searched for automatically</text>
</svg>
